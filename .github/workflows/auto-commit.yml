name: Activity Pulse

on:
  schedule:
    # Wakes up at non-round minutes 4 times daily to evaluate natural randomized window
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch: # Manual one-click trigger for testing

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Evaluate Random Window & Generate Changes
        id: generate
        run: |
          # Run generator. If exit code is 2, interval has not elapsed yet (skip).
          set +e
          MSG=$(python scripts/generator.py)
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 2 ]; then
            echo "Natural randomized interval in progress. Skipping this cycle."
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "Random window active. Committing change: $MSG"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "commit_msg=$MSG" >> $GITHUB_OUTPUT
          else
            echo "Error running generator."
            exit $EXIT_CODE
          fi

      - name: Commit and Push Changes
        if: steps.generate.outputs.skip == 'false'
        run: |
          git config --global user.name "Charanbtech"
          git config --global user.email "charanbsd25@gmail.com"
          
          # Stage code & research notes
          git add src/ notes/
          
          # Record success to roll next randomized interval (26-68 hours)
          python -c "import sys; sys.path.insert(0, 'scripts'); import generator; generator.record_commit_success()"
          git add data/state.json
          
          # Commit and push
          git commit -m "${{ steps.generate.outputs.commit_msg }}"
          git push
